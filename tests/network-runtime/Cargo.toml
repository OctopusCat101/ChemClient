[workspace]

[package]
name = "chem-network-check"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.60.0", features = ["async"] }
waki = "=0.5.1"
aes = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
md-5 = "0.10"
serde_json = "1"

[profile.release]
opt-level = "s"

